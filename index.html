<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>我的私房菜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #faf7f2;
    color: #333;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #8b4513, #a0522d);
    color: #fff;
    text-align: center;
    padding: 28px 16px 20px;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 4px;
  }
  .header p {
    font-size: 13px;
    opacity: 0.8;
    margin-top: 6px;
  }

  /* ── Category ── */
  .category {
    margin: 20px 12px 0;
  }
  .category-title {
    font-size: 18px;
    font-weight: 600;
    color: #8b4513;
    padding: 0 4px 8px;
    border-bottom: 2px solid #d2b48c;
    margin-bottom: 12px;
  }

  /* ── Dish card ── */
  .dish-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  .dish-card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: transform 0.2s;
  }
  .dish-card:active {
    transform: scale(0.97);
  }
  .dish-img-wrap {
    width: 100%;
    aspect-ratio: 1;
    overflow: hidden;
    background: #eee;
  }
  .dish-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .dish-info {
    padding: 10px 10px 12px;
  }
  .dish-name {
    font-size: 15px;
    font-weight: 600;
    color: #333;
  }
  .dish-desc {
    font-size: 12px;
    color: #888;
    margin-top: 4px;
    display: none;
  }
  .dish-desc.show { display: block; }
  .dish-price {
    font-size: 14px;
    color: #c0392b;
    font-weight: 600;
    margin-top: 4px;
    display: none;
  }
  .dish-price.show { display: block; }

  /* ── Image modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }
  .modal-overlay.open {
    display: flex;
  }
  .modal-overlay img {
    max-width: 92vw;
    max-height: 88vh;
    border-radius: 8px;
    object-fit: contain;
  }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 24px 16px;
    font-size: 12px;
    color: #bbb;
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="shopName">菜单加载中...</h1>
  <p id="shopSub"></p>
</div>

<div id="menuContainer"></div>

<div class="modal-overlay" id="modal">
  <img id="modalImg" src="" alt="">
</div>

<div class="footer">扫码查看菜单</div>

<script>
(function() {
  const $ = (s) => document.querySelector(s);

  // Load menu data
  fetch('menu.json?v=' + Date.now())
    .then(r => r.json())
    .then(renderMenu)
    .catch(() => {
      $('#menuContainer').innerHTML =
        '<p style="text-align:center;padding:40px;color:#999">菜单加载失败，请刷新重试</p>';
    });

  function renderMenu(data) {
    $('#shopName').textContent = data.shopName || '菜单';
    if (data.subtitle) {
      $('#shopSub').textContent = data.subtitle;
    }

    const container = $('#menuContainer');
    container.innerHTML = '';

    data.categories.forEach(cat => {
      const section = document.createElement('div');
      section.className = 'category';

      const title = document.createElement('h2');
      title.className = 'category-title';
      title.textContent = cat.name;
      section.appendChild(title);

      const list = document.createElement('div');
      list.className = 'dish-list';

      cat.dishes.forEach(dish => {
        const card = document.createElement('div');
        card.className = 'dish-card';

        const imgWrap = document.createElement('div');
        imgWrap.className = 'dish-img-wrap';
        const img = document.createElement('img');
        img.src = dish.image;
        img.alt = dish.name;
        img.loading = 'lazy';
        imgWrap.appendChild(img);

        // Tap image to enlarge
        imgWrap.addEventListener('click', () => openModal(dish.image));

        const info = document.createElement('div');
        info.className = 'dish-info';

        const name = document.createElement('div');
        name.className = 'dish-name';
        name.textContent = dish.name;
        info.appendChild(name);

        if (dish.description) {
          const desc = document.createElement('div');
          desc.className = 'dish-desc show';
          desc.textContent = dish.description;
          info.appendChild(desc);
        }

        if (dish.price) {
          const price = document.createElement('div');
          price.className = 'dish-price show';
          price.textContent = '¥' + dish.price;
          info.appendChild(price);
        }

        card.appendChild(imgWrap);
        card.appendChild(info);
        list.appendChild(card);
      });

      section.appendChild(list);
      container.appendChild(section);
    });
  }

  // Modal
  const modal = $('#modal');
  const modalImg = $('#modalImg');

  function openModal(src) {
    modalImg.src = src;
    modal.classList.add('open');
  }

  modal.addEventListener('click', () => {
    modal.classList.remove('open');
    modalImg.src = '';
  });
})();
</script>
</body>
</html>
